<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 오답 노트</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<style>
  .wn-wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 80px; }
  .wn-group { margin-bottom: 30px; }
  .wn-group > h3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wn-group > h3 a { font-size: .85rem; font-weight: 400; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .empty { text-align: center; padding: 40px 20px; }
  .empty .big { font-size: 3rem; }
</style>
</head>
<body class="unit-gene">
<div class="wn-wrap">

<div class="hero">
  <span class="unit">📒 오답 노트</span>
  <h1>나의 오답 노트</h1>
  <p class="lead">각 차시의 확인 문제와 총정리에서 틀린 문제가 자동으로 모여요. 다시 풀어서 맞히면 목록에서 빠져요.</p>
  <div class="grid-3" id="stats"></div>
  <p class="small muted" style="margin:12px 0 0">🔒 오답 기록은 <b>지금 쓰는 기기의 이 브라우저에만</b> 저장돼요. 다른 기기나 다른 브라우저에서는 보이지 않고, 브라우저 기록(사이트 데이터)을 지우면 함께 지워져요.</p>
</div>

<div class="card" id="controls">
  <div class="filter-row" id="filters"></div>
  <div class="row" style="margin-top:12px">
    <label class="field">정렬
      <select id="sort">
        <option value="miss">많이 틀린 순</option>
        <option value="recent">최근에 틀린 순</option>
        <option value="page">차시 순서</option>
      </select>
    </label>
    <span class="spacer" style="flex:1"></span>
    <button class="btn primary" id="shuffle">🔀 섞어서 다시 풀기</button>
    <button class="btn" id="clear">🗑 모두 지우기</button>
  </div>
</div>

<div id="list"></div>

</div>

<script>
(function () {
  var UNITS = [["all", "전체"], ["Ⅴ-1 생식", "Ⅴ-1 생식"], ["Ⅴ-2 유전", "Ⅴ-2 유전"], ["Ⅶ-1 별", "Ⅶ-1 별"], ["총정리", "총정리"]];
  var pageInfo = {}, order = {};
  S2.PAGES.forEach(function (p, i) { pageInfo[p.file] = p; order[p.file] = i; });
  var filter = "all";
  try { filter = sessionStorage.getItem("s2-wn-filter") || "all"; } catch (e) { /* 무시 */ }

  function unitOf(x) { return (pageInfo[x.page] || {}).unit || "기타"; }

  function stats() {
    var all = S2.wrong.all();
    var byUnit = {};
    all.forEach(function (x) { var u = unitOf(x); byUnit[u] = (byUnit[u] || 0) + 1; });
    var worst = all.slice().sort(function (a, b) { return b.miss - a.miss; })[0];
    document.getElementById("stats").innerHTML =
      '<div class="stat"><div class="lbl">남은 오답</div><div class="big-num">' + all.length + "</div></div>" +
      '<div class="stat"><div class="lbl">단원별</div><div class="small">' + (["Ⅴ-1 생식", "Ⅴ-2 유전", "Ⅶ-1 별", "총정리"].map(function (u) { return u + " <b>" + (byUnit[u] || 0) + "</b>"; }).join("<br>")) + "</div></div>" +
      '<div class="stat"><div class="lbl">가장 많이 틀린 문제</div><div class="small">' + (worst ? "<b>" + worst.miss + "회</b> · " + strip(worst.q).slice(0, 40) + (strip(worst.q).length > 40 ? "…" : "") : "없음") + "</div></div>";
    var f = document.getElementById("filters");
    f.innerHTML = "";
    UNITS.forEach(function (u) {
      var n = u[0] === "all" ? all.length : (byUnit[u[0]] || 0);
      var b = document.createElement("button");
      b.className = "btn" + (filter === u[0] ? " primary" : "");
      b.textContent = u[1] + " (" + n + ")";
      b.onclick = function () { filter = u[0]; try { sessionStorage.setItem("s2-wn-filter", filter); } catch (e) { /* 무시 */ } render(false); };
      f.appendChild(b);
    });
  }
  function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }

  function toItem(x) {
    return {
      t: x.t, q: x.q, o: x.o, a: x.a, e: x.e,
      tag: (x.tag ? x.tag + " · " : "") + "틀린 횟수 " + x.miss + "회",
      _origTag: x.tag, _wid: x.id, _page: x.page
    };
  }

  function render(shuffle) {
    stats();
    var list = document.getElementById("list");
    var all = S2.wrong.all().filter(function (x) { return filter === "all" || unitOf(x) === filter; });
    document.getElementById("controls").style.display = S2.wrong.all().length ? "" : "none";
    if (!all.length) {
      list.innerHTML = S2.wrong.all().length
        ? '<div class="card empty"><div class="big">🎯</div><p>이 단원에는 남은 오답이 없어요!</p></div>'
        : '<div class="card empty"><div class="big">🎉</div><h3>아직 모인 오답이 없어요</h3><p class="muted">각 차시의 <b>확인 문제</b>나 <a href="10-review.html">총정리 종합 문제</a>를 풀어 보세요. 틀린 문제는 여기에 자동으로 저장돼요.</p><a class="btn primary" href="index.html">수업 홈으로</a></div>';
      return;
    }
    var sort = document.getElementById("sort").value;
    all.sort(function (a, b) {
      if (sort === "recent") return b.last - a.last;
      if (sort === "page") return (order[a.page] || 99) - (order[b.page] || 99);
      return b.miss - a.miss || b.last - a.last;
    });
    list.innerHTML = "";
    var opts = {
      review: true, score: false,
      onAnswer: function () { stats(); },
      onRemove: function () { stats(); }
    };
    if (shuffle) {
      for (var i = all.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = all[i]; all[i] = all[j]; all[j] = t; }
      var g = document.createElement("section");
      g.className = "wn-group";
      g.innerHTML = "<h3>🔀 섞어서 풀기 · " + all.length + "문제</h3>";
      var box = document.createElement("div");
      g.appendChild(box); list.appendChild(g);
      S2.quiz(box, all.map(toItem), Object.assign({}, opts, { score: true }));
      return;
    }
    // 차시별로 묶기 (정렬 순서를 유지하면서 처음 나온 차시 순)
    var groups = [], seen = {};
    all.forEach(function (x) {
      if (!seen[x.page]) { seen[x.page] = { page: x.page, items: [] }; groups.push(seen[x.page]); }
      seen[x.page].items.push(x);
    });
    groups.forEach(function (gr) {
      var info = pageInfo[gr.page] || { title: gr.page, unit: "" };
      var sec = document.createElement("section");
      sec.className = "wn-group";
      sec.innerHTML = "<h3>" + (info.unit ? '<span class="chip acc">' + info.unit + "</span>" : "") + info.title + ' <a href="' + gr.page + '">개념 다시 보기 →</a></h3>';
      var box = document.createElement("div");
      sec.appendChild(box); list.appendChild(sec);
      S2.quiz(box, gr.items.map(toItem), Object.assign({ page: gr.page }, opts));
    });
  }

  document.getElementById("sort").onchange = function () { render(false); };
  document.getElementById("shuffle").onclick = function () { render(true); };
  document.getElementById("clear").onclick = function () {
    if (window.confirm("이 기기에 저장된 오답을 모두 지울까요? 되돌릴 수 없어요.")) { S2.wrong.clear(); render(false); }
  };
  document.addEventListener("DOMContentLoaded", function () { render(false); });
})();
</script>
</body>
</html>
